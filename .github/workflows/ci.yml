name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Run unit tests & build Debug APK
        working-directory: Subnook
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: Subnook/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
